<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Releases</title>
<style>
:root { --bg: #fff; --fg: #1d1d1f; --muted: #6b6b70; --line: #e3e3e6; --panel: #f6f6f8;
        --ok: #2e7d32; --note: #8a6d00; --warn: #c45500; --err: #c62828; --link: #1a5fb4; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #151517; --fg: #ececee; --muted: #9a9aa2; --line: #2c2c31; --panel: #1d1d21;
          --ok: #81c784; --note: #e0c050; --warn: #ffab60; --err: #ef7a7a; --link: #8ab4f8; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
.nav { border-bottom: 1px solid var(--line); }
.nav div { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 18px;
           align-items: baseline; flex-wrap: wrap; }
.nav b { margin-right: auto; }
.nav a { text-decoration: none; }
.nav a[aria-current="page"] { color: var(--fg); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.sub, .muted { color: var(--muted); }
.sub { margin: 0 0 16px; }
a { color: var(--link); }
.wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
td small { display: block; color: var(--muted); font-size: 12px; }
.ok { color: var(--ok); } .note { color: var(--note); } .bad { color: var(--err); }
.wait { color: var(--muted); }
.stage { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px;
         border: 1px solid var(--muted); color: var(--muted); white-space: nowrap; }
.stage.ready { border-color: var(--ok); color: var(--ok); }
.stage.submitted { border-color: var(--link); color: var(--link); }
.stage.published { border-color: var(--ok); color: var(--ok); background: var(--panel); }
.empty { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
code { font-size: 13px; }
h2 { font-size: 16px; margin: 28px 0 8px; }
.badge { font-size: 11px; padding: 0 6px; border-radius: 999px; border: 1px solid var(--link);
         color: var(--link); margin-left: 6px; }
</style>
</head>
<body>
<nav class="nav"><div>
  <b>CRAN watch</b>
  <a href="./">Dashboard</a>
  <a href="releases.html" aria-current="page">Releases</a>
  <a href="about.html">About</a>
  <a id="repo" href="https://github.com/mdsumner/my-cran-watch">Repository</a>
</div></nav>
<main>
  <h1>Releases</h1>
  <p class="sub" id="gen">Loading...</p>
  <h2>Getting ready</h2>
  <div id="board"></div>
  <h2>CRAN incoming</h2>
  <p class="sub" id="qgen"></p>
  <div id="incoming"></div>
</main>
<script>
function el(tag, attrs, text) {
  var e = document.createElement(tag);
  for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  return e;
}
var REPO = "mdsumner/my-cran-watch";
var STAGES = { preparing: 0, ready: 1, submitted: 2, published: 3 };

// a table cell: one line of result, coloured, with an optional second line
function cell(text, cls, small, href) {
  var td = el("td");
  var main = href ? el("a", { href: href, "class": cls || "" }, text) : el("span", { "class": cls || "" }, text);
  td.appendChild(main);
  if (small) td.appendChild(el("small", {}, small));
  return td;
}
function ciClass(s) { return s === "pass" ? "ok" : s === "fail" ? "bad" : "wait"; }
function countClass(c, summary) {
  if (summary && /^failed/.test(summary)) return "bad";
  return c === 0 ? "ok" : c == null ? "wait" : "note";
}
function builderCell(p, name) {
  var hits = (p.builders || []).filter(function (b) { return b.builder === name; });
  if (!hits.length) return cell("no result yet", "wait", null, p.issue ? issueUrl(p.issue) : null);
  var b = hits[hits.length - 1];
  var cls = b.status === "OK" ? "ok" : b.status === "NOTE" ? "note" : b.status ? "bad" : "wait";
  var small = [b.r, b.version && b.version !== p.version ? "checked " + b.version : null]
    .filter(Boolean).join(", ");
  return cell(b.summary || "waiting for results", cls, small || null, b.log_url || b.url);
}
// queue age (since first seen) in the cell, the folder date on hover
function queueCell(p) {
  var q = p.queue, t = q.first_seen || "";
  var n = days(t);
  var td = cell("in " + q.folder, "note", isNaN(n) ? "since " + t : n + (n === 1 ? " day" : " days") + " in queue",
                "https://nx10.github.io/cransubs/pkg#" + encodeURIComponent(p.package));
  td.title = "in incoming/" + q.folder + " since " + (q.in_folder || t) + "; first seen " + t;
  return td;
}
function issueUrl(n) { return "https://github.com/" + REPO + "/issues/" + n; }

fetch("release.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function (d) {
    REPO = d.repo || REPO;
    document.getElementById("gen").textContent = "Updated " + d.generated +
      ". Packages leave the board two weeks after CRAN publishes them.";
    var pkgs = (d.packages || []).slice().sort(function (a, b) {
      return (STAGES[a.stage] || 0) - (STAGES[b.stage] || 0) || a.package.localeCompare(b.package);
    });
    var box = document.getElementById("board");
    if (!pkgs.length) { showEmpty(box); return; }
    var t = el("table"), hr = el("tr");
    ["Package", "Stage", "GitHub CI", "checktor", "urlchecker", "win-builder", "mac-builder", "CRAN"]
      .forEach(function (h) { hr.appendChild(el("th", {}, h)); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody");
    pkgs.forEach(function (p) {
      var tr = el("tr");
      var pc = el("td");
      pc.appendChild(p.issue ? el("a", { href: issueUrl(p.issue) }, p.package) : document.createTextNode(p.package));
      pc.appendChild(el("small", {}, (p.version || "?") + " from " + (p.repo || "?") + "@" + (p.ref || "?") +
        (p.sha ? " (" + p.sha.slice(0, 7) + ")" : "")));
      tr.appendChild(pc);
      if (p.error) {
        var e = cell(p.error, "bad"); e.setAttribute("colspan", "7"); tr.appendChild(e);
        tb.appendChild(tr); return;
      }
      var st = el("td"); st.appendChild(el("span", { "class": "stage " + p.stage }, p.stage)); tr.appendChild(st);
      var ci = p.ci || {};
      tr.appendChild(cell(ci.status || "unknown", ciClass(ci.status), ci.summary,
        p.repo && p.sha ? "https://github.com/" + p.repo + "/commit/" + p.sha : null));
      ["checktor", "urlchecker"].forEach(function (s) {
        var c = (p.checks || {})[s] || {};
        tr.appendChild(cell(c.summary || "not run", countClass(c.count, c.summary)));
      });
      tr.appendChild(builderCell(p, "win-builder"));
      tr.appendChild(builderCell(p, "mac-builder"));
      var cran = p.published ? cell("published " + p.cran_version, "ok", p.published_on)
        : p.queue ? queueCell(p)
        : cell("not submitted", "wait", p.cran_version ? "CRAN has " + p.cran_version : "new package");
      tr.appendChild(cran);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    var w = el("div", { "class": "wrap" }); w.appendChild(t); box.appendChild(w);
  })
  .catch(function () {
    document.getElementById("gen").textContent = "";
    showEmpty(document.getElementById("board"));
  });

// the CRAN incoming queue (docs/queue.json, from the queue workflow):
// every submission of yours, tracked on the board or not, and those that
// left in the last week
// CRAN's listing times are its server clock (Vienna, ahead of UTC), read
// here as UTC, so a fresh submission can look slightly in the future
function days(t) { return Math.max(0, Math.floor((Date.now() - Date.parse(t.slice(0, 10) + "T" + t.slice(11, 16) + "Z")) / 864e5)); }
var OUTCOME = { published: ["published", "ok"], archived: ["archived", "bad"], left: ["left queue", "wait"] };
fetch("queue.json", { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
  .then(function (q) {
    document.getElementById("qgen").textContent = "Checked twice daily, last changed " + (q.changed || "?") +
      ". Days in queue count from when a version was first seen; hover for when it entered its current folder.";
    var rows = (q.entries || []).map(function (e) { return { e: e, left: false }; })
      .concat((q.exits || []).map(function (e) { return { e: e, left: true }; }));
    var box = document.getElementById("incoming");
    if (!rows.length) { box.appendChild(el("div", { "class": "empty" }, "Nothing of yours in CRAN incoming.")); return; }
    var t = el("table"), hr = el("tr");
    ["Package", "Folder", "In queue", "Status"].forEach(function (h) { hr.appendChild(el("th", {}, h)); });
    var th = el("thead"); th.appendChild(hr); t.appendChild(th);
    var tb = el("tbody");
    rows.forEach(function (r) {
      var e = r.e, tr = el("tr"), first = e.first_seen || e.modified || "";
      var pc = el("td");
      pc.appendChild(el("a", { href: "https://nx10.github.io/cransubs/pkg#" + encodeURIComponent(e.package) }, e.package));
      if (e["new"]) pc.appendChild(el("span", { "class": "badge" }, "new"));
      pc.appendChild(el("small", {}, e.version));
      tr.appendChild(pc);
      var folder = e.folder + (e.subfolder ? "/" + e.subfolder : "");
      tr.appendChild(r.left ? cell(folder, "wait", "last folder")
                            : cell(folder, "note", null, e.url));
      var n = days(first), age = cell(n + (n === 1 ? " day" : " days"), null, "since " + first.slice(0, 10));
      if (!r.left) age.title = "in incoming/" + folder + " since " + e.modified + "; first seen " + first;
      else age.firstChild.textContent = "after " + days(first) + "d";
      tr.appendChild(age);
      var o = r.left ? OUTCOME[e.outcome] || [e.outcome, "wait"] : ["in queue", "note"];
      tr.appendChild(cell(o[0], o[1], r.left ? (e.left || "").slice(0, 10) : null));
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    var w = el("div", { "class": "wrap" }); w.appendChild(t); box.appendChild(w);
  })
  .catch(function () { document.getElementById("qgen").textContent = "No queue snapshot yet."; });

function showEmpty(box) {
  var p = el("div", { "class": "empty" });
  p.appendChild(document.createTextNode("Nothing on its way to CRAN. Add a package under "));
  p.appendChild(el("code", {}, "releasing:"));
  p.appendChild(document.createTextNode(" in config.yml, or open an issue titled "));
  p.appendChild(el("code", {}, "release: <pkg>"));
  p.appendChild(document.createTextNode(", then paste win-builder and mac-builder results links into that issue."));
  box.appendChild(p);
}
</script>
<script>
// point the repo link at whichever fork is serving this page
(function () {
  var m = location.hostname.match(/^([^.]+)\.github\.io$/), p = location.pathname.split("/")[1];
  if (m && p) document.getElementById("repo").href = "https://github.com/" + m[1] + "/" + p;
})();
</script>
</body>
</html>
