# my-cran-watch configuration
#
# This is the ONLY file that should contain anything specific to a person.
# Everything in R/ and scripts/ reads from here. Keep it that way and the
# repo can become a fork-modify-deploy template later by blanking this file.

# All email addresses that appear in the Maintainer field of your packages.
maintainer_emails:
  - mdsumner@gmail.com
  - michael.sumner@aad.gov.au

# Packages listing you as an author but maintained by someone else are
# watched with role "contribute". Matched on maintainer_emails in
# Authors@R and on these names in the Author field (whole words, any
# case). author_exclude drops packages you do not want to see.
author_names:
  - Michael Sumner
  - Michael D. Sumner
  - Michael D Sumner
  - Michael David Sumner
author_exclude: []

# GitHub identity used in commit messages and issue assignment.
github_user: mdsumner

# r-universe universes to cross-check against the CRAN package list.
universes:
  - hypertidy
  - mdsumner
  - Trackage
  - australianantarcticdivision

# Packages to watch regardless of the CRAN Maintainer field. Needed when
# maintainership has changed in reality but not yet on CRAN (the field
# only updates at the next accepted release), e.g. an adopted package.
extra_packages:
  - fasterize

# Which roles open issues: maintainer (my packages), contribute, interest.
# Everything is still tracked in state and shown on the site.
issue_roles: [maintainer]

# Condition kinds that get an issue each: checks, universe, metadata,
# deadline, archived, revdeps, canary. Everything else goes in one summary
# issue (label "summary") at most every summary_days, pointing at the
# dashboard; the previous summary is closed when a new one opens.
issue_kinds: [deadline, archived]
summary_days: 6

# Packages maintained by someone else that you want to hear about. Each is
# a bare name or {package, role}; role is "contribute" (you send fixes) or
# "interest" (you depend on it or just want to know), default "interest".
# These get check issues (labelled by role) but are never tagged/released
# and are not expected in your r-universes.
watch:
  - terra
  - gdalraster
  - wk
  - sedonadb
  - ggsql
#  - package: sf
#    role: contribute
#  - package: terra
#    role: interest
#  - gdalraster

# rOpenSci pkgcheck (https://docs.ropensci.org/pkgcheck/), opt-in per
# package and run by hand: Actions > pkgcheck > Run workflow. Checks the
# GitHub default branch (not the CRAN release), so it is a heads-up for the
# next submission. Results go on each package's details page. Each entry
# is a bare name (repo from repo_map) or {package, repo, goodpractice}.
# goodpractice adds a full R CMD check + covr: slow, off unless asked.
# ignore drops checks by name, e.g. rOpenSci-specific ones: has_orcid,
# has_ror, has_contrib, pkgdown, repo_has_website, left_assign, num_imports.
pkgcheck:
  goodpractice: false
  ignore: []
  packages:
    - vapour
    - tidync
#    - package: gdalraster
#      repo: firelab/gdalraster
#      goodpractice: true

# Packages on their way to CRAN, shown on the release board
# (releases.html). Each is a bare name (repo from repo_map) or
# {package, repo, ref}; ref is a branch, tag or sha, default the repo's
# default branch. Listing one opens a "release: <pkg>" issue; paste the
# win-builder and mac-builder results links there. You can also skip
# this list and open such an issue yourself ("release: pkg@ref" for a
# branch). The issue closes when CRAN publishes the version; remove the
# entry then (it drops off the board two weeks after publication).
releasing: [vapour]   # TEMP: branch dry run
#  - vapour
#  - package: ximage
#    ref: release-0.1

# Map of CRAN package name -> GitHub repo (owner/name).
# Run scripts/init_repo_map.R to generate a draft of this from the URL and
# BugReports fields in the CRAN db, then review by hand. Packages absent
# from this map are watched and reported on, but never tagged/released
# (the watcher will not push to a repo it was not explicitly told about).
repo_map:
  affinity: hypertidy/affinity
  angstroms: AustralianAntarcticDivision/angstroms
  area: hypertidy/area
  basf: mdsumner/basf
  bgmfiles: AustralianAntarcticDivision/bgmfiles
  ceramic: hypertidy/ceramic
  crsmeta: hypertidy/crsmeta
  decido: hypertidy/decido
  dsn: hypertidy/dsn
  fasterize: ecohealthalliance/fasterize
  geographiclib: hypertidy/geographiclib
  geojson: ropensci/geojson
  ggpolypath: mdsumner/ggpolypath
  gibble: mdsumner/gibble
  graticule: hypertidy/graticule
  lazysf: hypertidy/lazysf
  ncmeta: hypertidy/ncmeta
  orsifronts: AustralianAntarcticDivision/orsifronts
  ozmaps: mdsumner/ozmaps
  palr: AustralianAntarcticDivision/palr
  PROJ: hypertidy/PROJ
  quadmesh: hypertidy/quadmesh
  rbgm: AustralianAntarcticDivision/rbgm
  reproj: hypertidy/reproj
  sfdct: hypertidy/sfdct
  silicate: hypertidy/silicate
  sooty: mdsumner/sooty
  spbabel: mdsumner/spbabel
  spex: mdsumner/spex
  tabularaster: hypertidy/tabularaster
  textures: hypertidy/textures
  tidync: ropensci/tidync
  tissot: hypertidy/tissot
  traipse: AustralianAntarcticDivision/traipse
  trip: Trackage/trip
  tripEstimation: Trackage/tripEstimation
  unjoin: hypertidy/unjoin
  vapour: hypertidy/vapour
  vaster: hypertidy/vaster
  wkpool: hypertidy/wkpool
  ximage: hypertidy/ximage

# Conditions must be observed on this many consecutive runs before an
# issue is opened (CRAN flavors flake; see README).
consecutive_required: 2

# Flavors whose transient noise you never want to hear about. Matched as a
# regex against the flavor name. Leave empty to hear everything.
ignore_flavors: []
#  - "macos"

# Check statuses that count as noteworthy at all.
notify_statuses: [NOTE, WARN, WARNING, ERROR, FAIL]
