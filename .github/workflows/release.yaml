name: release

# Release board: packages on their way to CRAN (config `releasing:` or an
# open issue titled "release: <pkg>"). Runs when you open or comment on a
# release issue (e.g. paste a win-builder/mac-builder link), when
# config.yml changes on main, after each CRAN queue snapshot, or by hand.
on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]
  push:
    branches: [main, "claude/**"]   # TEMP: branch dry run
    paths: [config.yml]
  workflow_run:
    workflows: [queue]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Rerun checktor/urlchecker even if the commit is unchanged"
        type: boolean
        default: false

permissions:
  contents: write   # commit docs/release.json back to this repo
  issues: write     # open release issues, keep their status comment

# one board writer at a time; a new trigger waits rather than cancels
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # issue events only for release issues, and only from the repo owner
    if: >-
      (github.event_name != 'issues' && github.event_name != 'issue_comment') ||
      (startsWith(github.event.issue.title, 'release:') &&
       github.actor == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # urlchecker renders the README with pandoc to find its URLs
      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "yaml", "urlchecker", "checktor"))'

      - name: Update release board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # a run on another branch is a dry run: no issue changes
          DRY: ${{ github.ref != 'refs/heads/main' && '--dry-run' || '' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
          # a pasted builder link may still be running: look again for a while
          WAIT: ${{ github.event_name == 'issue_comment' && '--wait' || '' }}
        run: Rscript scripts/release.R $DRY $FORCE $WAIT

      - name: Commit board
        if: always() && github.ref == 'refs/heads/main'
        run: |
          git config user.name "my-cran-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/release.json
          git diff --cached --quiet && exit 0
          git commit -m "release: $(date -u '+%F %H:%M')"
          git pull --rebase origin main
          git push
