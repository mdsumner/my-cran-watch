name: details

on:
  schedule:
    # weekly, a few hours after the watcher's usual slot
    - cron: "41 22 * * 0"
  workflow_dispatch:
    inputs:
      packages:
        description: "Space-separated packages (blank = all of mine)"
        type: string
        default: ""

permissions:
  contents: write   # commit docs/pkg back to this repo

jobs:
  details:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        run: Rscript -e 'install.packages(c("jsonlite", "yaml", "urlchecker", "checktor"))'

      - name: Build package details
        env:
          PKGS: ${{ inputs.packages }}
        run: Rscript scripts/details.R $PKGS

      - name: Commit details
        if: always()
        run: |
          git config user.name "my-cran-watch"
          git config user.email "actions@users.noreply.github.com"
          git add docs/pkg/
          git diff --cached --quiet || git commit -m "details: $(date -u +%F)"
          git pull --rebase origin main
          git push
